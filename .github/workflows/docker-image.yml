name: Nix Docker Image Build & Publish

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

env:
  REGISTRY_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            nix_system: x86_64-linux
            runner: ubuntu-latest
          - arch: arm64
            nix_system: aarch64-linux
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Nix Docker image
        id: nix-build
        run: |
          image_path="$(nix build ".#packages.${{ matrix.nix_system }}.dockerImage" --no-link --print-out-paths)"
          echo "image_path=$image_path" >> "$GITHUB_OUTPUT"

      - name: Load Docker image
        run: docker load --input "${{ steps.nix-build.outputs.image_path }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push architecture image
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          image_ref="${REGISTRY_IMAGE}:sha-${GITHUB_SHA}-${ARCH}"
          docker tag text-to-speech-rs:latest "$image_ref"
          docker push "$image_ref"

  merge:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-

      - name: Create and push multi-architecture manifest
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}
        run: |
          mapfile -t tags < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          tag_args=()
          for tag in "${tags[@]}"; do
            tag_args+=(--tag "$tag")
          done

          docker buildx imagetools create "${tag_args[@]}" \
            "${REGISTRY_IMAGE}:sha-${GITHUB_SHA}-amd64" \
            "${REGISTRY_IMAGE}:sha-${GITHUB_SHA}-arm64"

      - name: Inspect image
        run: docker buildx imagetools inspect "${REGISTRY_IMAGE}:${{ steps.meta.outputs.version }}"
